[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjazzmusicarchives"
dynamic = ["version"]
description = "Typed Python client for Jazz Music Archives (jazzmusicarchives.com)"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
stealth = ["curl-cffi"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyjazzmusicarchives*"]

[tool.setuptools.dynamic]
version = {attr = "pyjazzmusicarchives.version.__version__"}
